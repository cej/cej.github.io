<body>
  <div class="container">
    <div id="standings">standings here</div>
  </div>
<script>
var id = '1ElZfQ40Ma1SvI6r6NYI8zmXvRznzkBfZIZ4auI47XYc';
var gid = '1393436135';
var url = 'https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:json&tq&gid='+gid;
fetch(url)
  .then(response => response.text())
  .then(data => document.getElementById("standings").innerHTML=myItems(data.substring(47).slice(0, -2))
);
function myItems(jsonString){
  var json = JSON.parse(jsonString);
  var json = JSON.parse(JSON.stringify(jsonString));
  var table = '<table class="table table-striped"><tr>'
  json.table.cols.forEach(colonne => table += '<th>' + colonne.label + '</th>')
  table += '</tr>'
  json.table.rows.forEach(ligne => {
    table += '<tr>'
    ligne.c.forEach(cellule => {
        try{var valeur = cellule.f ? cellule.f : cellule.v}
        catch(e){var valeur = ''}
        table += '<td>' + valeur + '</td>'
      }
    )
    table += '</tr>'
    }
  )
  table += '</table>'
  return table
  /* document.getElementById("standings").innerHTML = table; */
}

</script>
</body></html>
